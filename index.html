
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tic Tac Toe</title>
  <style>
    body { font-family: sans-serif; text-align: center; }
    .board { display: grid; grid-template-columns: repeat(3, 100px); gap: 5px; justify-content: center; margin-top: 20px; }
    .cell { width: 100px; height: 100px; font-size: 2em; display: flex; align-items: center; justify-content: center; background: #f0f0f0; cursor: pointer; }
    .info { margin-top: 20px; font-size: 1.2em; }
  </style>
</head>
<body>
  <h1>Крестики-нолики</h1>
  <div id="rating">Рейтинг: 0</div>
  <div class="board" id="board"></div>
  <div class="info" id="info"></div>
  <script src="main.js"></script>
</body>
</html>
